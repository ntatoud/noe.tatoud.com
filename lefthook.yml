pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,json,css,md,mdx,toml,yaml}'
      exclude: '**/*.gen.ts'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

pre-push:
  commands:
    lint:
      run: pnpm run lint
    content-collections:
      run: pnpm --filter @ntatoud/content build
    typecheck:
      run: pnpm --filter @ntatoud/content --filter @ntatoud/web typecheck
