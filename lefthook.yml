pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,json,css,md,mdx,toml,yaml}'
      exclude:
        - '**/*.gen.ts'
        - 'pnpm-lock.yaml'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    # Skipped with a warning when gitleaks is missing; CI scans every push anyway.
    secrets:
      run: |
        if ! command -v gitleaks >/dev/null; then
          echo 'gitleaks not installed, skipping the secret scan'
          exit 0
        fi
        gitleaks git --pre-commit --staged --redact --no-banner

pre-push:
  commands:
    lint:
      run: pnpm run lint
    typecheck:
      run: pnpm run typecheck
    fallow:
      run: pnpm exec fallow audit --quiet
