pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,json,css,md,mdx,toml}'
      exclude: 'src/routeTree.gen.ts'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

pre-push:
  commands:
    lint:
      run: pnpm run lint
    typecheck:
      run: pnpm exec content-collections build && pnpm exec tsgo --noEmit
