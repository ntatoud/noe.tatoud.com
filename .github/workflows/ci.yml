name: 🧹 Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: 🔍 Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
        env:
          LEFTHOOK: '0'

      - name: 🎨 Check formatting
        run: bunx oxfmt --check .

      - name: 🧹 Lint
        run: bun run lint

      - name: 🏗️ Generate content-collections types
        run: bunx content-collections build

      - name: 🔎 Typecheck
        run: bunx tsc --noEmit
