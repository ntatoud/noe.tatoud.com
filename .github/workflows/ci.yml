name: 🧹 Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: 🔍 Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'

      - name: 🎨 Check formatting
        run: pnpm exec oxfmt --check .

      - name: 🧹 Lint
        run: pnpm run lint

      - name: 🏗️ Generate content-collections types
        run: pnpm exec content-collections build

      - name: 🔎 Typecheck
        run: pnpm exec tsc --noEmit
