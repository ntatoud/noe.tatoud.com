name: 🧹 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: 🔍 Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: fallow's health report reads git churn for hotspots.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'

      - name: 🎨 Check formatting
        run: pnpm exec oxfmt --check .

      - name: 🧹 Lint
        run: pnpm run lint

      # Dead code, duplication and complexity in one pass (`.fallowrc.jsonc`).
      - name: 🪦 Dead code & code health
        run: pnpm run fallow

      - name: 🔎 Typecheck
        run: pnpm run typecheck

      - name: 🧪 Test
        run: pnpm run test

  # The repo is public, so a leaked secret is a published secret.
  secrets:
    name: 🔐 Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Content is baked into the bundle at build time (ADR-0008), so a bad document
  # is a broken build rather than a broken request. The unit tests above cover
  # the plugin's output on its own; this covers the whole chain it feeds —
  # Rollup resolving the emitted asset imports, and the prerender pass actually
  # rendering every page. Both failure modes only show up in a real build.
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'

      - name: 🏗️ Build
        run: pnpm run build

      - name: 📦 Check static output
        run: pnpm --filter @ntatoud/web check:static
