name: "\U0001F9F9 Code Quality"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: "\U0001F50D Lint, Format & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
        env:
          LEFTHOOK: '0'

      - name: "\U0001F3A8 Check formatting"
        run: bunx oxfmt --check .

      - name: "\U0001F9F9 Lint"
        run: bun run lint

      - name: "\U0001F3D7\uFE0F Generate fumadocs types"
        run: bunx fumadocs-mdx

      - name: "\U0001F50E Typecheck"
        run: bunx tsc --noEmit
