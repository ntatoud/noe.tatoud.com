name: 🧹 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: 🔍 Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: fallow's health report reads git churn for hotspots.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'

      - name: 🎨 Check formatting
        run: pnpm exec oxfmt --check .

      - name: 🧹 Lint
        run: pnpm run lint

      - name: 🪦 Dead code & code health
        run: pnpm run fallow

      - name: 🔎 Typecheck
        run: pnpm run typecheck

      - name: 🧪 Test
        run: pnpm run test

  secrets:
    name: 🔐 Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only a real build exercises Rollup's asset imports and the prerender pass.
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'

      - name: 🏗️ Build
        run: pnpm run build

      - name: 📦 Check static output
        run: pnpm --filter @ntatoud/web check:static
