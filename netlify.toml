[build]
base = "apps/web"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "24"

# Public static assets at the site root (favicon, logos, manifest, OG images)
# Declared first so the more specific rules below can override for /assets/*.
[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.webp"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.ico"
[headers.values]
Cache-Control = "public, max-age=86400"

# Content images — cache for 1 day
[[headers]]
for = "/content/*"
[headers.values]
Cache-Control = "public, max-age=86400"

# Blog/project/talk detail pages compile MDX to HTML server-side on every
# request — cache the rendered page at the CDN edge so it isn't re-rendered
# per visit. Content only changes on deploy, and Netlify purges this cache
# on each deploy, so a 1-day TTL is safe.
[[headers]]
for = "/blog/*"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/projects/*"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/talks/*"
[headers.values]
Cache-Control = "public, max-age=86400"

# Netlify image CDN — content-addressed by URL params, safe to cache long-term
# Note: Netlify forces a 1-day browser Cache-Control on /.netlify/images
# responses; this override only takes effect if Netlify lifts that restriction.
[[headers]]
for = "/.netlify/images*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Hashed Vite bundles — safe to cache forever (declared last so it wins over
# the generic /*.png and /*.svg rules above for files inside /assets/).
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Agent discovery — RFC 8288 Link relation headers (RFC 9727 §3)
[[headers]]
for = "/"
[headers.values]
Link = '</llms.txt>; rel="describedby"; type="text/plain", </sitemap.xml>; rel="sitemap"; type="application/xml"'

[functions]
node_bundler = "esbuild"
included_files = [
  "../../node_modules/@takumi-rs/core-linux-x64-gnu/**/*.*",
  # MDX content is read from the filesystem at runtime by the server functions,
  # so it must be bundled into the serverless function.
  "../../content/**",
]
