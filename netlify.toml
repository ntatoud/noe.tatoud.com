# The publish directory is the whole site; the edge function is the only per-request code (ADR-0011).
[build]
command = "pnpm run build"
publish = "apps/web/dist/client"
edge_functions = "netlify/edge-functions"

[build.environment]
NODE_VERSION = "24"

# Declared first so the /assets/* rule below can override these.
[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.webp"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.ico"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/content/*"
[headers.values]
Cache-Control = "public, max-age=86400"

# Markdown twins: same revalidate policy as the edge function's responses.
[[headers]]
for = "/*.md"
[headers.values]
Content-Type = "text/markdown; charset=utf-8"
Cache-Control = "public, max-age=0, must-revalidate"

# Not `immutable`: file names are stable across deploys.
[[headers]]
for = "/og/*"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/rss.xml"
[headers.values]
Content-Type = "application/rss+xml; charset=utf-8"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/atom.xml"
[headers.values]
Content-Type = "application/atom+xml; charset=utf-8"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/feed.json"
[headers.values]
Content-Type = "application/feed+json; charset=utf-8"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/sitemap.xml"
[headers.values]
Content-Type = "application/xml; charset=utf-8"
Cache-Control = "public, max-age=0, must-revalidate"

# Content-addressed by URL; Netlify forces a 1-day browser Cache-Control here, so this only applies if that is lifted.
[[headers]]
for = "/.netlify/images*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Hashed Vite bundles; declared after /*.png and /*.svg so it wins for files inside /assets/.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Agent discovery: RFC 8288 Link headers (RFC 9727 §3).
[[headers]]
for = "/"
[headers.values]
Link = '</llms.txt>; rel="describedby"; type="text/plain", </sitemap.xml>; rel="sitemap"; type="application/xml", </index.md>; rel="alternate"; type="text/markdown"'

# Page HTML deliberately has no `Vary: Accept` (ADR-0009); if an agent cache replays HTML for markdown, add `Vary = "Accept"` to page routes.
