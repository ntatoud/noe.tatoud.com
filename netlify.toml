[build]
command = "pnpm run build"
publish = "dist/client"

# Hashed Vite bundles — safe to cache forever
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Content images — cache for 1 day
[[headers]]
for = "/content/*"
[headers.values]
Cache-Control = "public, max-age=86400"

# Public static assets (favicon, logos, manifest)
[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.ico"
[headers.values]
Cache-Control = "public, max-age=86400"

[functions]
node_bundler = "esbuild"
directory = "netlify/functions"
included_files = ["node_modules/@takumi-rs/core-linux-x64-gnu/**/*.*"]
